<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Feliz Cumpleaños Marianne 🌌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a0a26;
    --bg-mid:#181048;
    --bg-glow:#331c5c;
    --gold:#f4c95d;
    --gold-soft:#ffe4a3;
    --rose:#ff7fab;
    --rose-deep:#ff4f8b;
    --lavender:#c9b6ff;
    --cream:#fdf6ec;
    --font-display:'Playfair Display', serif;
    --font-script:'Dancing Script', cursive;
    --font-body:'Quicksand', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background: radial-gradient(ellipse at 50% 20%, var(--bg-glow) 0%, var(--bg-mid) 45%, var(--bg-deep) 100%);
    font-family: var(--font-body);
    color: var(--cream);
    -webkit-user-select:none; user-select:none;
    touch-action: none;
  }
  #app{ position:relative; width:100vw; height:100vh; height:100dvh; overflow:hidden; }

  /* ---------- estrellas de fondo ---------- */
  .stars-bg{ position:absolute; inset:0; z-index:0; pointer-events:none; }
  .star{ position:absolute; background:#fff; border-radius:50%; opacity:.7; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.25; transform:scale(1);} 50%{opacity:1; transform:scale(1.3);} }

  /* ---------- pantallas ---------- */
  .screen{ position:absolute; inset:0; width:100%; height:100%; }
  .hidden{ display:none !important; }

  canvas.fx-canvas{ position:absolute; inset:0; width:100%; height:100%; z-index:5; pointer-events:none; }

  /* ---------- INTRO ---------- */
  #intro{ display:flex; align-items:center; justify-content:center; text-align:center; z-index:2; }
  .intro-content{ position:relative; z-index:6; padding: 0 24px; display:flex; flex-direction:column; align-items:center; }
  .stars-deco{ color:var(--gold); letter-spacing:10px; font-size:14px; opacity:0; animation: fadeUp .8s ease forwards .2s; }
  .intro-title{
    font-family:var(--font-display); font-weight:500; font-style:italic;
    font-size:clamp(20px,6vw,28px); letter-spacing:2px; margin:14px 0 0; color:var(--lavender);
  }
  .intro-title span{ display:inline-block; opacity:0; transform:translateY(14px); animation: letterIn .5s ease forwards; }
  .intro-name{
    font-family:var(--font-script); font-weight:700; color:var(--gold);
    font-size:clamp(48px,16vw,92px); margin:2px 0 10px; line-height:1;
    text-shadow: 0 0 30px rgba(244,201,93,.55);
    opacity:0; animation: nameIn 1s cubic-bezier(.2,.8,.2,1) forwards 1.1s;
  }
  .intro-sub{
    font-size:15px; color:var(--cream); opacity:.85; max-width:280px; margin:0 auto;
    opacity:0; animation: fadeUp .8s ease forwards 1.9s;
  }
  .enter-btn{
    margin-top:34px; padding:14px 34px; border-radius:999px; border:1px solid var(--gold);
    background:rgba(244,201,93,.08); color:var(--gold-soft); font-family:var(--font-body);
    font-weight:600; font-size:15px; letter-spacing:.5px; cursor:pointer;
    opacity:0; animation: fadeUp .8s ease forwards 2.4s, pulseGlow 2.4s ease-in-out infinite 3.2s;
  }
  .enter-btn:active{ transform:scale(.96); }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
  @keyframes letterIn{ to{opacity:1; transform:translateY(0);} }
  @keyframes nameIn{ from{opacity:0; transform:scale(.7) rotate(-4deg);} to{opacity:1; transform:scale(1) rotate(0);} }
  @keyframes pulseGlow{ 0%,100%{ box-shadow:0 0 0 0 rgba(244,201,93,.35);} 50%{ box-shadow:0 0 0 10px rgba(244,201,93,0);} }

  /* flores intro */
  .bloom-layer{ position:absolute; inset:0; z-index:3; pointer-events:none; }
  .bloom{ position:absolute; opacity:0; transform:scale(0) rotate(0deg); animation: bloomIn 1.6s ease-out forwards; }
  @keyframes bloomIn{
    0%{ opacity:0; transform:scale(0) rotate(-30deg); }
    55%{ opacity:1; transform:scale(1.05) rotate(6deg); }
    75%{ opacity:1; transform:scale(.95) rotate(-2deg); }
    100%{ opacity:0; transform:scale(1) rotate(0deg) translateY(-10px); }
  }

  /* pétalos flotantes ambiente */
  .petals-layer{ position:absolute; inset:0; z-index:4; pointer-events:none; overflow:hidden; }
  .petal{ position:absolute; top:-20px; will-change: transform, opacity; animation-name: fall; animation-timing-function: linear; animation-fill-mode: forwards; }
  @keyframes fall{
    0%{ transform: translateY(-5vh) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:.9; }
    100%{ transform: translateY(110vh) translateX(var(--drift)) rotate(360deg); opacity:.15; }
  }

  /* ---------- GALERÍA ---------- */
  #gallery{ z-index:2; display:flex; flex-direction:column; }
  .gallery-header{ position:relative; z-index:6; text-align:center; padding:22px 20px 4px; }
  .gallery-header .eyebrow{ font-size:11px; letter-spacing:4px; text-transform:uppercase; color:var(--lavender); opacity:.75; margin:0; }
  .gallery-header h2{ font-family:var(--font-script); color:var(--gold); font-size:38px; margin:2px 0 0; text-shadow:0 0 20px rgba(244,201,93,.4); }

  .sphere-wrap{ position:relative; flex:1; perspective:900px; }
  .planet-glow{
    position:absolute; left:50%; top:50%; width:380px; height:380px; margin:-190px 0 0 -190px;
    border-radius:50%; background:radial-gradient(circle, rgba(255,127,171,.18) 0%, rgba(201,182,255,.08) 55%, transparent 75%);
    filter:blur(6px); z-index:1; pointer-events:none;
  }
  .sphere-container{
    position:absolute; left:50%; top:50%; width:0; height:0; z-index:2;
  }
  .tile{
    position:absolute; left:0; top:0; width:64px; height:64px; margin:-32px 0 0 -32px;
    border-radius:14px; overflow:hidden; cursor:pointer;
    border:1.5px solid rgba(255,255,255,.35);
    box-shadow:0 4px 18px rgba(0,0,0,.45);
    will-change: transform, opacity;
  }
  .tile img, .tile video{ width:100%; height:100%; object-fit:cover; display:block; }
  .tile .placeholder{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    flex-direction:column; font-family:var(--font-display); font-style:italic;
  }
  .tile .ph-icon{ font-size:22px; line-height:1; }
  .tile .ph-num{ font-size:10px; opacity:.75; margin-top:2px; font-family:var(--font-body); }
  .tile .video-badge{
    position:absolute; right:4px; bottom:4px; background:rgba(10,10,38,.6); border-radius:50%;
    width:18px; height:18px; display:flex; align-items:center; justify-content:center; font-size:9px;
  }

  .hint{ text-align:center; font-size:12px; color:var(--lavender); opacity:.6; padding:6px 0 18px; letter-spacing:.3px; }

  /* ---------- BOTÓN FLOTANTE + PANEL ADMINISTRAR ---------- */
  .fab{
    position:absolute; right:18px; bottom:22px; z-index:15; width:52px; height:52px; border-radius:50%;
    background:linear-gradient(160deg, #2a1c5e, #1a1140); border:1px solid rgba(244,201,93,.5);
    color:var(--gold-soft); font-size:20px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 22px rgba(0,0,0,.45); cursor:pointer;
  }
  .fab:active{ transform:scale(.94); }
  .mute-btn{
    position:absolute; left:18px; bottom:22px; z-index:15; width:48px; height:48px; border-radius:50%;
    background:linear-gradient(160deg, #2a1c5e, #1a1140); border:1px solid rgba(201,182,255,.5);
    color:var(--lavender); font-size:18px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 22px rgba(0,0,0,.45); cursor:pointer;
  }
  .mute-btn:active{ transform:scale(.94); }

  .manage-overlay{ position:absolute; inset:0; z-index:30; display:flex; align-items:flex-end; }
  .manage-backdrop{ position:absolute; inset:0; background:rgba(6,4,22,.75); animation: fadeIn .2s ease; }
  .manage-sheet{
    position:relative; z-index:2; width:100%; max-height:82vh; margin:0 auto;
    background:linear-gradient(180deg, #1c1350, #100a30);
    border-radius:22px 22px 0 0; border:1px solid rgba(244,201,93,.3); border-bottom:none;
    display:flex; flex-direction:column; padding:10px 18px 18px;
    animation: sheetIn .3s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes sheetIn{ from{ transform:translateY(30px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .manage-handle{ width:38px; height:4px; border-radius:4px; background:rgba(255,255,255,.25); margin:6px auto 10px; }
  .manage-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .manage-header h3{ font-family:var(--font-display); font-style:italic; font-weight:500; margin:0; font-size:18px; color:var(--gold-soft); }
  .manage-close{ width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:var(--cream); font-size:13px; cursor:pointer; }
  .add-btn{
    width:100%; padding:13px; border-radius:14px; border:1px dashed rgba(244,201,93,.55);
    background:rgba(244,201,93,.08); color:var(--gold-soft); font-family:var(--font-body); font-weight:600;
    font-size:14px; cursor:pointer; margin-bottom:12px;
  }
  .add-form{ background:rgba(255,255,255,.05); border-radius:14px; padding:12px; margin-bottom:14px; display:flex; flex-direction:column; gap:10px; }
  .add-form textarea{
    width:100%; min-height:56px; resize:vertical; border-radius:10px; border:1px solid rgba(255,255,255,.2);
    background:rgba(0,0,0,.25); color:var(--cream); font-family:var(--font-body); font-size:13px; padding:9px;
  }
  .add-form .preview{ width:100%; max-height:140px; border-radius:10px; overflow:hidden; background:#000; }
  .add-form .preview img, .add-form .preview video{ width:100%; max-height:140px; object-fit:cover; display:block; }
  .add-form-actions{ display:flex; gap:10px; }
  .add-form-actions button{ flex:1; padding:10px; border-radius:10px; border:none; font-family:var(--font-body); font-weight:600; font-size:13px; cursor:pointer; }
  #add-cancel{ background:rgba(255,255,255,.1); color:var(--cream); }
  #add-confirm{ background:var(--gold); color:#2a1c00; }

  .manage-list{ overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-bottom:4px; touch-action:pan-y; }
  .manage-row{ display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.04); border-radius:12px; padding:8px; }
  .manage-thumb{ width:44px; height:44px; border-radius:9px; overflow:hidden; flex:none; background:#000; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .manage-thumb img, .manage-thumb video{ width:100%; height:100%; object-fit:cover; }
  .manage-phrase{ flex:1; font-size:12px; color:var(--cream); opacity:.85; line-height:1.35; margin:0; }
  .manage-delete{ flex:none; width:30px; height:30px; border-radius:50%; background:rgba(255,79,139,.12); border:1px solid rgba(255,79,139,.4); color:#ff9fbb; font-size:13px; cursor:pointer; }
  .manage-empty{ text-align:center; font-size:12px; opacity:.6; padding:14px 0; }

  /* ---------- MODAL ---------- */
  .modal{ position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:22px; }
  .modal-backdrop{ position:absolute; inset:0; background:rgba(6,4,22,.82); backdrop-filter: blur(4px); animation: fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal-card{
    position:relative; z-index:2; width:100%; max-width:360px; max-height:88vh;
    background:linear-gradient(180deg, #1c1350, #120a34);
    border:1px solid rgba(244,201,93,.35); border-radius:22px; padding:16px;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
    animation: cardIn .35s cubic-bezier(.2,.8,.2,1);
    overflow-y:auto; touch-action:pan-y;
  }
  @keyframes cardIn{ from{opacity:0; transform:scale(.85) translateY(20px);} to{opacity:1; transform:scale(1) translateY(0);} }
  .modal-close{
    position:absolute; top:10px; right:10px; z-index:3; width:30px; height:30px; border-radius:50%;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:var(--cream);
    font-size:14px; cursor:pointer;
  }
  .modal-media{ width:100%; border-radius:14px; overflow:hidden; background:#000; min-height:160px; display:flex; align-items:center; justify-content:center; }
  .modal-media img, .modal-media video{ width:100%; height:auto; max-height:52vh; object-fit:cover; display:block; }
  .modal-media .placeholder-full{
    width:100%; aspect-ratio:1/1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    font-family:var(--font-display); font-style:italic;
  }
  .modal-media .placeholder-full .ph-icon{ font-size:44px; }
  .modal-phrase{
    font-family:var(--font-display); font-style:italic; font-size:17px; line-height:1.5; text-align:center;
    color:var(--gold-soft); padding:0 4px 2px;
  }
  .modal-phrase::before{ content:"“"; } .modal-phrase::after{ content:"”"; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===================== INTRO ===================== -->
  <div id="intro" class="screen">
    <div class="stars-bg" id="stars-bg-intro"></div>
    <canvas id="fx-canvas-intro" class="fx-canvas"></canvas>
    <div class="bloom-layer" id="bloom-layer"></div>
    <div class="petals-layer" id="petals-intro"></div>
    <div class="intro-content">
      <div class="stars-deco">✦ ✧ ✦</div>
      <h1 class="intro-title" id="intro-title"></h1>
      <p class="intro-name">Marianne</p>
      <p class="intro-sub">Un pequeño universo de recuerdos, hecho especialmente para ti.</p>
      <button class="enter-btn" id="enter-btn">Toca para entrar ✨</button>
    </div>
  </div>

  <!-- ===================== GALERÍA ===================== -->
  <div id="gallery" class="screen hidden">
    <div class="stars-bg" id="stars-bg-gallery"></div>
    <canvas id="fx-canvas-gallery" class="fx-canvas"></canvas>
    <div class="petals-layer" id="petals-gallery"></div>
    <div class="gallery-header">
      <p class="eyebrow">Planeta de recuerdos</p>
      <h2>Marianne</h2>
    </div>
    <div class="sphere-wrap">
      <div class="planet-glow"></div>
      <div class="sphere-container" id="sphere-container"></div>
    </div>
    <p class="hint">Arrastra para girar el planeta · toca una foto</p>
    <button class="fab" id="manage-btn" title="Administrar recuerdos">✏️</button>
    <button class="mute-btn" id="mute-btn" title="Silenciar música">🔈</button>
    <audio id="bg-music" src="assets/sparks-coldplay.mp3" loop preload="auto"></audio>
  </div>

  <!-- ===================== PANEL ADMINISTRAR ===================== -->
  <div class="manage-overlay hidden" id="manage-overlay">
    <div class="manage-backdrop" id="manage-backdrop"></div>
    <div class="manage-sheet">
      <div class="manage-handle"></div>
      <div class="manage-header">
        <h3>Administrar recuerdos</h3>
        <button class="manage-close" id="manage-close">✕</button>
      </div>
      <button class="add-btn" id="add-memory-btn">+ Agregar foto o video</button>
      <input type="file" id="file-input" accept="image/*,video/*" hidden>
      <div class="add-form hidden" id="add-form">
        <div class="preview" id="add-preview"></div>
        <textarea id="add-phrase" placeholder="Escribe una frase para este recuerdo (opcional)"></textarea>
        <div class="add-form-actions">
          <button id="add-cancel">Cancelar</button>
          <button id="add-confirm">Guardar</button>
        </div>
      </div>
      <div class="manage-list" id="manage-list"></div>
    </div>
  </div>

  <!-- ===================== MODAL ===================== -->
  <div class="modal hidden" id="modal">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-card">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="modal-media" id="modal-media"></div>
      <p class="modal-phrase" id="modal-phrase"></p>
    </div>
  </div>

</div>

<script>
/* =========================================================================
   Ahora puedes agregar o borrar fotos y videos directamente desde la app
   (botón ✏️ abajo a la derecha, dentro de la galería). Lo que agregues ahí
   queda guardado en este navegador/celular automáticamente.

   Esta lista de abajo (SEED_MEMORIES) son solo los recuerdos iniciales con
   los que arranca la app la primera vez que se abre. Si quieres, también
   puedes editarla a mano antes de compartir el archivo:
     { type:'image' | 'video' | 'placeholder', src:'assets/archivo.jpg', phrase:'texto' }
   ========================================================================= */
const SEED_MEMORIES = [
  { type:'image', src:'assets/marianne-vela.jpg', phrase:'Esa sonrisa junto a la lucecita de la vela: pura magia de cumpleaños.' },
  { type:'video', src:'assets/marianne-video1.mp4', phrase:'Momentos como este son los que quiero guardar para siempre.' },
  { type:'video', src:'assets/marianne-video2.mp4', phrase:'Cada video tuyo es un recordatorio de lo especial que eres.' },
  { type:'placeholder', icon:'💛', color:'#f4c95d', phrase:'Cada año que pasa, el mundo se llena un poco más de tu luz.' },
  { type:'placeholder', icon:'🌷', color:'#ff7fab', phrase:'Contigo hasta lo cotidiano se siente celebración.' },
  { type:'placeholder', icon:'✨', color:'#c9b6ff', phrase:'Feliz cumpleaños a la persona que hace que todo brille más.' },
  { type:'placeholder', icon:'🌙', color:'#8fb3ff', phrase:'Eres de esas personas que uno quiere guardar en el corazón para siempre.' },
  { type:'placeholder', icon:'🎂', color:'#ffd166', phrase:'Hoy el universo entero conspira para celebrarte, Marianne.' },
  { type:'placeholder', icon:'💫', color:'#b8a6e0', phrase:'Gracias por existir de esta forma tan tuya y tan especial.' },
];

/* Frases de reserva por si agregas más fotos que frases */
const EXTRA_PHRASES = [
  'Que la vida te siga sorprendiendo con cosas hermosas.',
  'Un año más de ser exactamente quien eres, y eso ya es un regalo.',
  'Hoy celebramos el día en que el mundo se puso mejor.',
  'Ojalá nunca dejes de sonreír así.',
];

/* =========================================================================
   Guardado local (IndexedDB): permite agregar/borrar fotos y videos desde
   la app y que queden guardados en este mismo navegador/celular.
   ========================================================================= */
const DB_NAME = 'marianne_gallery_db';
const STORE = 'memories';
function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE)){
        db.createObjectStore(STORE, { keyPath:'id', autoIncrement:true });
      }
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function dbGetAll(){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function dbAdd(record){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).add(record);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function dbDelete(id){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).delete(id);
    req.onsuccess = ()=> resolve();
    req.onerror = ()=> reject(req.error);
  });
}

let MEMORIES = []; // se llena al cargar la app (ver initApp)
let dbAvailable = true; // si es false, "agregar/borrar recuerdos" queda deshabilitado pero la galería igual se muestra

function resolveSrc(mem){
  return mem.blob ? URL.createObjectURL(mem.blob) : mem.src;
}

async function initApp(){
  try{
    let records = await dbGetAll();
    if(records.length === 0){
      for(const seed of SEED_MEMORIES){ await dbAdd(seed); }
      records = await dbGetAll();
    }
    MEMORIES = records.map(r => ({ ...r, displaySrc: r.type !== 'placeholder' ? resolveSrc(r) : null }));
  } catch(err){
    // Algunos navegadores (sobre todo al abrir el .html directamente desde el
    // celular, fuera de un navegador "de verdad", o en modo privado) bloquean
    // IndexedDB. En ese caso mostramos igual los recuerdos iniciales, solo que
    // no se podrán agregar/borrar nuevos desde el celular.
    console.warn('IndexedDB no disponible, se muestran los recuerdos iniciales sin guardado local:', err);
    dbAvailable = false;
    MEMORIES = SEED_MEMORIES.map((seed, i)=> ({
      ...seed,
      id: 'seed-' + i,
      displaySrc: seed.type !== 'placeholder' ? seed.src : null
    }));
  }
}
const dbReady = initApp();

/* ================= INTRO: título letra por letra ================= */
(function initIntroTitle(){
  const text = 'Feliz Cumpleaños';
  const wrap = document.getElementById('intro-title');
  [...text].forEach((ch,i)=>{
    const span = document.createElement('span');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.animationDelay = (0.15 + i*0.035) + 's';
    wrap.appendChild(span);
  });
})();

/* ================= Estrellas de fondo ================= */
function paintStars(container, count){
  const frag = document.createDocumentFragment();
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className='star';
    const size = Math.random()*2 + 0.6;
    s.style.width = size+'px';
    s.style.height = size+'px';

/* ================= Fuegos artificiales (canvas) ================= */
function makeFireworks(canvasId){
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  let particles = [];
  function resize(){ canvas.width = canvas.clientWidth * devicePixelRatio; canvas.height = canvas.clientHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  resize();
  window.addEventListener('resize', resize);

  function burst(x, y, colors){
    const count = 26 + Math.floor(Math.random()*14);
    for(let i=0;i<count;i++){
      const angle = (Math.PI*2*i)/count + Math.random()*0.2;
      const speed = 1.6 + Math.random()*2.6;
      particles.push({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        life: 1,
        decay: 0.012 + Math.random()*0.012,
        color: colors[Math.floor(Math.random()*colors.length)],
        size: 1.6 + Math.random()*1.8
      });
    }
  }

  let raf = null;
  let running = false;
  function tick(){
    ctx.clearRect(0,0,canvas.clientWidth, canvas.clientHeight);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.vy += 0.028; p.life -= p.decay;
      ctx.globalAlpha = Math.max(p.life,0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    });
    particles = particles.filter(p=>p.life>0);
    ctx.globalAlpha = 1;
    if(particles.length > 0){
      raf = requestAnimationFrame(tick);
    } else {
      running = false; // detiene el loop: nada que dibujar, ahorra batería/CPU
    }
  }
  function ensureRunning(){
    if(!running){ running = true; tick(); }
  }
  const originalBurst = burst;
  burst = function(x,y,colors){ originalBurst(x,y,colors); ensureRunning(); };

  return { burst, canvas };
}

const fxIntro = makeFireworks('fx-canvas-intro');
const fxGallery = makeFireworks('fx-canvas-gallery');

const FW_COLORS = ['#f4c95d','#ff7fab','#c9b6ff','#9fd8ff','#ffe4a3','#ff4f8b'];

function fireworksShow(fx, durationMs){
  const w = fx.canvas.clientWidth, h = fx.canvas.clientHeight;
  const start = Date.now();
  const timer = setInterval(()=>{
    if(Date.now()-start > durationMs){ clearInterval(timer); return; }
    fx.burst(w*(0.2+Math.random()*0.6), h*(0.18+Math.random()*0.35), FW_COLORS);
  }, 480);
  fx.burst(w*0.5, h*0.28, FW_COLORS);
}

   Música de fondo: "Sparks" de Coldplay.

     assets/sparks-coldplay.mp3

const BgMusic = (function(){
  const el = document.getElementById('bg-music');
  el.volume = 0.55;
  let muted = false;
  let pausedForVideo = false; // recuerda si la pausamos nosotros (para saber si retomarla)

  function start(){
    el.play().catch(()=>{
      // Algunos navegadores bloquean el autoplay con sonido hasta un gesto del usuario;
      // como start() se llama desde el click de "Entrar", normalmente ya cuenta como gesto.
    });
  }
  function toggleMute(){
    muted = !muted;
    el.muted = muted;
    return muted;
  }
  // se llama al abrir un video del recuerdo: para la música de fondo
  function pauseForVideo(){
    if(!el.paused){ pausedForVideo = true; el.pause(); }
  }
  // se llama al cerrar el modal o cuando el video termina: retoma la música si estaba sonando antes
  function resumeAfterVideo(){
    if(pausedForVideo){ pausedForVideo = false; el.play().catch(()=>{}); }
  }
  return { start, toggleMute, pauseForVideo, resumeAfterVideo };
})();

/* ================= Planeta 3D de recuerdos ================= */
const sphereContainer = document.getElementById('sphere-container');
const galleryScreen = document.getElementById('gallery');
let sphereTiles = [];
let spherePoints = [];
let angleY = 0.4, angleX = 0.15, velY = 0.0018, velX = 0;
let dragging = false, lastX = 0, lastY = 0;
const SPHERE_PERSPECTIVE = 420;
let frameCount = 0;

function rebuildSphereTiles(){
  sphereContainer.innerHTML = '';
  sphereTiles = [];
  const N = MEMORIES.length;
  spherePoints = [];
  if(N === 0) return;

  const R = Math.min(210, Math.max(150, 52 * Math.sqrt(N))); // radio adaptable
  sphereContainer.dataset.radius = R;

  // distribución esférica tipo Fibonacci (uniforme)
  const offset = 2 / N;
  const increment = Math.PI * (3 - Math.sqrt(5));
  for(let i=0;i<N;i++){
    const y = ((i*offset) - 1) + offset/2;
    const r = Math.sqrt(Math.max(0,1 - y*y));
    const phi = i * increment;
    spherePoints.push({ x: Math.cos(phi)*r, y, z: Math.sin(phi)*r });
  }

  MEMORIES.forEach((mem, i)=>{
    const el = document.createElement('div');
    el.className = 'tile';
    let videoEl = null;
    if(mem.type === 'image'){
      el.innerHTML = `<img src="${mem.displaySrc}" alt="recuerdo ${i+1}" loading="lazy">`;
    } else if(mem.type === 'video'){
      el.innerHTML = `<video src="${mem.displaySrc}" muted loop playsinline preload="auto" autoplay></video><div class="video-badge">▶</div>`;
      videoEl = el.querySelector('video');
      videoEl.play().catch(()=>{});
    } else {
      el.innerHTML = `<div class="placeholder" style="background:radial-gradient(circle at 35% 30%, ${mem.color}55, ${mem.color}22 60%, #140b34 100%);">
        <span class="ph-icon">${mem.icon || '🌟'}</span>
      </div>`;
    }
    el.addEventListener('click', (ev)=> openMemory(mem, ev));
    sphereContainer.appendChild(el);
    sphereTiles.push({ el, videoEl });
  });
}

function renderSphere(){
  if(spherePoints.length === 0) return;
  const R = Number(sphereContainer.dataset.radius) || 150;

  spherePoints.forEach((p, i)=>{
    // rotación en Y
    let x = p.x*Math.cos(angleY) + p.z*Math.sin(angleY);
    let z = -p.x*Math.sin(angleY) + p.z*Math.cos(angleY);
    let y = p.y;
    // rotación en X
    let y2 = y*Math.cos(angleX) - z*Math.sin(angleX);
    let z2 = y*Math.sin(angleX) + z*Math.cos(angleX);

    const px = x*R, py = y2*R, pz = z2*R;
    const scale = SPHERE_PERSPECTIVE / (SPHERE_PERSPECTIVE + pz);
    const opacity = 0.35 + ((pz + R) / (2*R)) * 0.65;

    const tile = sphereTiles[i];
    if(!tile) return;
    tile.el.style.transform = `translate3d(${px*scale}px, ${py*scale}px, 0) scale(${scale})`;
    tile.el.style.opacity = opacity.toFixed(2);
    tile.el.style.zIndex = Math.round(pz*1000);
  });
}

function sphereFrame(){
  frameCount++;
  if(!galleryScreen.classList.contains('hidden')){
    if(!dragging){ angleY += velY; angleX += velX; velX *= 0.94; }
    renderSphere();
  }
  requestAnimationFrame(sphereFrame);
}
sphereFrame();

const sphereWrap = document.querySelector('.sphere-wrap');
function pointerDown(e){
  dragging = true;
  const pt = e.touches ? e.touches[0] : e;
  lastX = pt.clientX; lastY = pt.clientY;
}
function pointerMove(e){
  if(!dragging) return;
  const pt = e.touches ? e.touches[0] : e;
  const dx = pt.clientX - lastX, dy = pt.clientY - lastY;
  angleY += dx * 0.006;
  angleX += dy * 0.006;
  angleX = Math.max(-1, Math.min(1, angleX));
  lastX = pt.clientX; lastY = pt.clientY;
  // no llamamos render() aquí: el loop principal (sphereFrame) ya redibuja cada frame,
  // así evitamos calcular las posiciones dos veces por frame durante el arrastre
}
function pointerUp(){ dragging = false; }

sphereWrap.addEventListener('mousedown', pointerDown);
window.addEventListener('mousemove', pointerMove);
window.addEventListener('mouseup', pointerUp);
sphereWrap.addEventListener('touchstart', pointerDown, {passive:true});
sphereWrap.addEventListener('touchmove', pointerMove, {passive:true});
sphereWrap.addEventListener('touchend', pointerUp);

/* ================= Modal de recuerdo ================= */
const modal = document.getElementById('modal');
const modalMedia = document.getElementById('modal-media');
const modalPhrase = document.getElementById('modal-phrase');

function openMemory(mem, ev){
  // mini fuegos artificiales al tocar
  const rect = fxGallery.canvas.getBoundingClientRect();
  const x = (ev.clientX ?? (ev.touches && ev.touches[0].clientX) ?? rect.width/2) - rect.left;
  const y = (ev.clientY ?? (ev.touches && ev.touches[0].clientY) ?? rect.height/2) - rect.top;
  fxGallery.burst(x, y, FW_COLORS);

  // pausamos el video de la miniatura (si lo tiene) mientras se ve en grande
  sphereTiles.forEach(t=>{ if(t.videoEl) t.videoEl.pause(); });

  if(mem.type === 'image'){
    modalMedia.innerHTML = `<img src="${mem.displaySrc}" alt="recuerdo">`;
  } else if(mem.type === 'video'){
    modalMedia.innerHTML = `<video src="${mem.displaySrc}" controls autoplay playsinline></video>`;
    BgMusic.pauseForVideo();
    const openedVideo = modalMedia.querySelector('video');
    openedVideo.addEventListener('ended', ()=> BgMusic.resumeAfterVideo());
  } else {
    modalMedia.innerHTML = `<div class="placeholder-full" style="background:radial-gradient(circle at 35% 30%, ${mem.color}55, ${mem.color}22 60%, #140b34 100%);">
      <span class="ph-icon">${mem.icon || '🌟'}</span>
    </div>`;
  }
  modalPhrase.textContent = mem.phrase || EXTRA_PHRASES[Math.floor(Math.random()*EXTRA_PHRASES.length)];
  modal.classList.remove('hidden');
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-backdrop').addEventListener('click', closeModal);
function closeModal(){
  modal.classList.add('hidden');
  modalMedia.querySelectorAll('video').forEach(v=>v.pause());
  BgMusic.resumeAfterVideo();
}

/* ================= Panel: administrar recuerdos ================= */
const manageOverlay = document.getElementById('manage-overlay');
const manageList = document.getElementById('manage-list');
const fileInput = document.getElementById('file-input');
const addForm = document.getElementById('add-form');
const addPreview = document.getElementById('add-preview');
const addPhrase = document.getElementById('add-phrase');
let pendingFile = null;

function openManage(){
  renderManageList();
  manageOverlay.classList.remove('hidden');
}
function closeManage(){
  manageOverlay.classList.add('hidden');
  resetAddForm();
}
document.getElementById('manage-btn').addEventListener('click', openManage);
document.getElementById('manage-close').addEventListener('click', closeManage);
document.getElementById('manage-backdrop').addEventListener('click', closeManage);

function renderManageList(){
  manageList.innerHTML = '';
  if(MEMORIES.length === 0){
    manageList.innerHTML = '<p class="manage-empty">Todavía no hay fotos ni videos. Agrega el primero arriba ✨</p>';
    return;
  }
  MEMORIES.forEach(mem=>{
    const row = document.createElement('div');
    row.className = 'manage-row';
    let thumbHTML;
    if(mem.type === 'image'){ thumbHTML = `<img src="${mem.displaySrc}" alt="">`; }
    else if(mem.type === 'video'){ thumbHTML = `<video src="${mem.displaySrc}" muted></video>`; }
    else { thumbHTML = `<div style="background:radial-gradient(circle at 35% 30%, ${mem.color}55, ${mem.color}22 60%, #140b34 100%); width:100%; height:100%; display:flex; align-items:center; justify-content:center;">${mem.icon || '🌟'}</div>`; }
    row.innerHTML = `
      <div class="manage-thumb">${thumbHTML}</div>
      <p class="manage-phrase">${(mem.phrase || '').slice(0,90)}</p>
      <button class="manage-delete" title="Borrar">🗑</button>
    `;
    row.querySelector('.manage-delete').addEventListener('click', ()=> deleteMemory(mem.id));
    manageList.appendChild(row);
  });
}

document.getElementById('add-memory-btn').addEventListener('click', ()=>{
  if(!dbAvailable){
    alert('Este navegador no permite guardar recuerdos nuevos aquí. Prueba abriendo la página en Chrome o Safari en vez del visor interno de la app donde la abriste.');
    return;
  }
  fileInput.click();
});

fileInput.addEventListener('change', ()=>{
  const file = fileInput.files[0];
  if(!file) return;
  pendingFile = file;
  const url = URL.createObjectURL(file);
  const isVideo = file.type.startsWith('video');
  addPreview.innerHTML = isVideo
    ? `<video src="${url}" muted controls playsinline></video>`
    : `<img src="${url}" alt="">`;
  addPhrase.value = '';
  addForm.classList.remove('hidden');
});

document.getElementById('add-cancel').addEventListener('click', resetAddForm);

function resetAddForm(){
  pendingFile = null;
  fileInput.value = '';
  addPreview.innerHTML = '';
  addPhrase.value = '';
  addForm.classList.add('hidden');
}

document.getElementById('add-confirm').addEventListener('click', async ()=>{
  if(!pendingFile) return;
  const isVideo = pendingFile.type.startsWith('video');
  const record = {
    type: isVideo ? 'video' : 'image',
    blob: pendingFile,
    phrase: addPhrase.value.trim() || EXTRA_PHRASES[Math.floor(Math.random()*EXTRA_PHRASES.length)]
  };
  const id = await dbAdd(record);
  MEMORIES.push({ ...record, id, displaySrc: URL.createObjectURL(pendingFile) });
  resetAddForm();
  renderManageList();
  rebuildSphereTiles();
});

async function deleteMemory(id){
  if(!dbAvailable){
    alert('Este navegador no permite borrar recuerdos aquí. Prueba abriendo la página en Chrome o Safari en vez del visor interno de la app donde la abriste.');
    return;
  }
  const ok = confirm('¿Borrar este recuerdo? Esta acción no se puede deshacer.');
  if(!ok) return;
  await dbDelete(id);
  const mem = MEMORIES.find(m=> m.id === id);
  if(mem && mem.blob && mem.displaySrc) URL.revokeObjectURL(mem.displaySrc);
  MEMORIES = MEMORIES.filter(m=> m.id !== id);
  renderManageList();
  rebuildSphereTiles();
}
</script>
